services:
  - type: web
    name: rag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false  # you'll set this manually in the Render dashboard (secret)
      - key: DATA_DIR
        value: /app/data
      - key: CHROMA_DIR
        value: /app/data/chroma_store
      - key: UPLOAD_DIR
        value: /app/data/uploaded_files
      - key: CORS_ORIGINS
        sync: false  # set to your deployed frontend URL after it's created

  - type: web
    name: rag-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false  # set to your deployed backend URL (from rag-backend service)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html